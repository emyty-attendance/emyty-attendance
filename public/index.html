<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Emyty Attendance</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="brand">
      <div class="brand-icon">✓</div>
      <div>
        <div class="brand-title" id="company-name">Emyty Attendance</div>
        <div class="brand-subtitle">Daily Attendance &amp; Photo Verification</div>
      </div>
    </div>
    <div class="header-clock" id="live-clock">--:--:--</div>
  </header>

  <!-- Main Container -->
  <main class="container">
    <!-- Success Confirmation State (Hidden by default) -->
    <div id="success-screen" class="card confirmation-card" style="display: none;">
      <div style="font-size: 48px; color: var(--success); margin-bottom: 8px;">✓</div>
      <img id="conf-photo" class="confirmation-photo" src="" alt="Clock-In Photo">
      <h2 class="confirmation-name" id="conf-name">Staff Member</h2>
      <div class="confirmation-time" id="conf-time">Clocked in at 00:00:00</div>
      <div id="conf-badge-wrapper" style="margin-bottom: 20px;">
        <span class="badge badge-success" id="conf-status">On Time</span>
      </div>
      <p style="font-size: 14px; color: var(--gray-600); margin-bottom: 20px;">
        Your daily attendance and photo proof have been securely recorded.
      </p>
      <button class="btn btn-primary" onclick="resetForm()">Clock In Another Staff</button>
    </div>

    <!-- Clock-in Form -->
    <div id="clockin-card" class="card">
      <h2 class="card-title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        Staff Clock-In
      </h2>

      <div id="alert-box" class="alert alert-danger" style="display: none;"></div>

      <form id="checkin-form" onsubmit="event.preventDefault(); submitClockIn();">
        <!-- 1. Select Staff -->
        <div class="form-group">
          <label class="form-label" for="staff-select">Select Your Name</label>
          <select id="staff-select" class="form-control" required onchange="onStaffChange()">
            <option value="">-- Choose your profile --</option>
          </select>
        </div>

        <!-- 2. PIN Code -->
        <div class="form-group">
          <label class="form-label" for="pin-input">Enter 4-Digit PIN</label>
          <input
            type="password"
            id="pin-input"
            class="form-control pin-input"
            maxlength="6"
            inputmode="numeric"
            pattern="[0-9]*"
            placeholder="••••"
            required
            autocomplete="off"
          >
        </div>

        <!-- 3. Camera Viewport -->
        <div class="form-group">
          <label class="form-label">Photo Proof (Live Selfie)</label>
          <div class="camera-box">
            <video id="webcam" autoplay playsinline muted></video>
            <canvas id="snapshot-canvas" style="display: none;"></canvas>
            
            <div id="camera-overlay" class="camera-overlay" style="display: none;">
              <span class="status-dot"></span> Camera Active
            </div>

            <div id="camera-placeholder" class="camera-placeholder">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                <circle cx="12" cy="13" r="4"></circle>
              </svg>
              <span>Starting camera...</span>
              <button type="button" class="btn btn-outline btn-sm" onclick="startCamera()">Retry Camera</button>
            </div>
          </div>

          <!-- Fallback photo upload in case browser blocks getUserMedia -->
          <div style="margin-top: 6px; font-size: 12px; color: var(--gray-600); text-align: center;">
            Camera blocked? 
            <label style="color: var(--primary); font-weight: 600; cursor: pointer;">
              Upload photo from device
              <input type="file" id="fallback-file" accept="image/*" capture="user" style="display: none;" onchange="handleFallbackPhoto(event)">
            </label>
          </div>
        </div>

        <!-- Notes / Location (Optional) -->
        <div class="form-group">
          <label class="form-label" for="notes-input">Notes (Optional)</label>
          <input type="text" id="notes-input" class="form-control" placeholder="e.g. Remote / On-site / Traffic note">
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submit-btn" class="btn btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
          Snap Photo & Clock In
        </button>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="app-footer">
    <div>Emyty Attendance &bull; Verification System</div>
  </footer>

  <script src="/js/clockin.js"></script>
</body>
</html>
